{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <h3>My Orders</h3>

    <table class="table table-bordered mt-3">

        <tr>
            <th>Order ID</th>
            <th>Status</th>
            <th>Total Price</th>
            <th>Date</th>
        </tr>

        {% for order in orders %}
        <tr>
            <td>{{ order.id }}</td>
            <td>{{ order.delivery_status }}</td>
            <td>{{ order.payment_status }}</td>
            <td>₹{{ order.total_price }}</td>
            <td>{{ order.created_at }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

{% endblock %}
