{% extends "auth_base.html" %}
{% block content %}

<div class="container mt-4">

<h2>My Products</h2>

{% for product in products %}
<div class="card mb-3">
    <div class="card-body">
        <h5>{{ product.product_name }}</h5>
        <p>Price: ₹{{ product.price }}</p>
        <p>Stock: {{ product.stock }}</p>
    </div>
</div>
{% endfor %}

</div>

{% endblock %}
