{% extends 'auth_base.html' %}
{% load static %}
{% block content %}
<style>
    .register-container {
        background: #fff;
        padding: 40px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
    }

    .register-title {
        font-weight: 700;
        font-size: 24px;
        margin-bottom: 25px;
        color: #333;
    }

    .form-control {
        border-radius: 4px;
        border: 1px solid #ccc;
        padding: 12px;
    }

    .form-control::placeholder {
        color: #444 !important;
        font-weight: 700 !important;
        opacity: 1;
    }

    .input-group-text {
        background-color: #f8f9fa;
        border-color: #ccc;
        color: #555;
        font-weight: 700;
    }

    .role-box {
        background: #fdfdfd;
        padding: 15px;
        border: 1px dashed #ccc;
        border-radius: 6px;
        margin-bottom: 25px;
    }

    .btn-classic {
        background: #000;
        color: #fff;
        border-radius: 4px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 14px;
        border: none;
    }

    .btn-classic:hover {
        background: #333;
        color: #fff;
    }
</style>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="register-container">
                <h2 class="register-title text-center">Create Your Account</h2>

                <!-- MESSAGES -->
                {% if messages %}
                {% for message in messages %}
                <div
                    class="alert alert-{% if message.tags == 'error' %}danger{% else %}warning{% endif %} py-2 small mb-3">
                    <strong>{{ message }}</strong>
                </div>
                {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <!-- ROLE SELECTION -->
                    <div class="role-box">
                        <label class="fw-bold mb-2">Account Type</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="roleCustomer"
                                    value="customer" checked onchange="toggleDistributorFields()">
                                <label class="form-check-label fw-bold" for="roleCustomer">Customer</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="roleDistributor"
                                    value="distributor" onchange="toggleDistributorFields()">
                                <label class="form-check-label fw-bold" for="roleDistributor">Distributor</label>
                            </div>
                        </div>
                    </div>

                    <!-- DISTRIBUTOR SPECIFIC FIELDS -->
                    <div id="distributorFields" style="display: none;" class="mb-4">
                        <h6 class="fw-bold border-bottom pb-2 mb-3">Distributor Information</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input type="text" name="phone" id="phone_field" class="form-control"
                                    placeholder="Phone Number">
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="text" name="city" id="city_field" class="form-control" placeholder="City">
                            </div>
                        </div>
                    </div>

                    <h6 class="fw-bold border-bottom pb-2 mb-3">Personal Details</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <input type="text" name="username" class="form-control" placeholder="Choose Username" required>
                    </div>

                    <div class="mb-3">
                        <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input type="password" name="password" class="form-control" placeholder="Password" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <input type="password" name="confirm" class="form-control" placeholder="Confirm Password"
                                required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-classic w-100 mt-3">
                        Register Now
                    </button>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Already a member? <a href="{% url 'login' %}"
                                class="fw-bold text-dark">Log In</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleDistributorFields() {
        const isDistributor = document.getElementById('roleDistributor').checked;
        const fieldsDiv = document.getElementById('distributorFields');
        const phoneInput = document.getElementById('phone_field');
        const cityInput = document.getElementById('city_field');

        if (isDistributor) {
            fieldsDiv.style.display = 'block';
            phoneInput.required = true;
            cityInput.required = true;
        } else {
            fieldsDiv.style.display = 'none';
            phoneInput.required = false;
            cityInput.required = false;
        }
    }
</script>

{% endblock %}
