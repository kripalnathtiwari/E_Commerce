{% extends 'auth_base.html' %}
{% load static %}
{% load socialaccount %}

{% block content %}

<style>
.login-box{
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.login-title{
    font-weight:600;
    margin-bottom:20px;
}
.input-icon{
    position:relative;
}
.input-icon i{
    position:absolute;
    left:12px;
    top:12px;
    color:#888;
}
.input-icon input{
    padding-left:38px;
}
</style>

<div class="container mt-5">
<div class="row justify-content-center">

<div class="col-md-5">
<div class="login-box">

    <h3 class="login-title text-center">Welcome Back</h3>
    <p class="text-center text-muted mb-4">Login to your account</p>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group input-icon mb-3">
            <i class="fa fa-user"></i>
            <input type="text" name="username" class="form-control"
                   placeholder="Username or Email" required>
        </div>

        <div class="form-group input-icon mb-4">
            <i class="fa fa-lock"></i>
            <input type="password" name="password" class="form-control"
                   placeholder="Password" required>
        </div>
        <div class="mb-3">
    <label class="mb-2">Login As</label>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="role" value="customer">
        <label class="form-check-label">Customer</label>
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="role" value="distributor">
        <label class="form-check-label">Distributor</label>
    </div>
</div>

        <button class="btn btn-primary w-100 py-2">
            Login
        </button>

        <div class="text-center mt-3">
            <small>
                Don’t have an account?
                <a href="{% url 'signup' %}">Register</a>
            </small>
        </div>

    </form>

    <hr class="my-4">
    
    <form action="{% provider_login_url 'google' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100 py-2">
            Continue with Google
        </button>
    </form>

</div>
</div>

</div>
</div>

{% endblock %}
