{% load static %}
<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="cache-control" content="max-age=604800" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>GreatKart | One of the Biggest Online Shopping Platform</title>

<link href="{% static 'images/favicon.ico' %}" rel="shortcut icon" type="image/x-icon">

<!-- jQuery -->
<script src="{% static 'js/jquery-2.0.0.min.js' %}" type="text/javascript"></script>

<!-- Bootstrap4 files-->
<script src="{% static 'js/bootstrap.bundle.min.js' %}" type="text/javascript"></script>
<link href="{% static 'css/bootstrap.css' %}" rel="stylesheet" type="text/css"/>

<!-- Font awesome 5 -->
<link href="{% static 'fonts/fontawesome/css/all.min.css' %}" type="text/css" rel="stylesheet">

<!-- custom style -->
<link href="{% static 'css/ui.css'%}" rel="stylesheet" type="text/css"/>
<link href="{% static 'css/responsive.css' %}" rel="stylesheet" media="only screen and (max-width: 1200px)" />

<!-- custom javascript -->
<script src="{% static 'js/script.js'%}" type="text/javascript"></script>

{% if messages %}
<script>
{% for message in messages %}
    alert("{{ message }}");
{% endfor %}
</script>
{% endif %}
<script type="text/javascript">
/// some script

// jquery ready start
$(document).ready(function() {
	$('.ajax-cart-form').on('submit', function(e) {
        var $form = $(this);
        var $clickedBtn = $(document.activeElement);
        
        // If it's a Buy Now click, allow normal form submission
        if ($clickedBtn.attr('name') === 'buy_now' || $clickedBtn.val() === 'true') {
            return true;
        }

        e.preventDefault();
        
        $.ajax({
            url: $form.attr('action'),
            method: 'POST',
            data: $form.serialize(),
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            success: function(response) {
                if (response.status === 'success') {
                    // Update cart count in navbar
                    var $cartCount = $('#cart-count');
                    $cartCount.text(response.cart_count);
                    if (response.cart_count > 0) {
                        $cartCount.show();
                    } else {
                        $cartCount.hide();
                    }
                    // Optional: Show message without redirect
                    console.log(response.message);
                    // alert(response.message); // Uncomment if you want an alert
                } else {
                    alert(response.message);
                }
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    alert("Please login to add items to cart.");
                    window.location.href = "{% url 'login' %}";
                } else {
                    alert('Something went wrong. Please try again.');
                }
            }
        });
    });
}); 
// jquery end
</script>

</head>
<body>

{% endblock %}
