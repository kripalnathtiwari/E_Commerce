{% extends "base.html" %}
{% block content %}

<style>

.checkout-wrapper{
    background:#f5f5f5;
    padding:50px 0;
    font-family:Georgia, serif;
}

.checkout-box{
    background:white;
    border:1px solid #e0e0e0;
    border-radius:6px;
    display:flex;
    overflow:hidden;
}

.left-panel{
    width:35%;
    background:#f8f9fa;
    padding:40px;
    border-right:1px solid #e5e5e5;
}

.left-panel h2{
    font-weight:600;
    border-bottom:2px solid #d4af37;
    padding-bottom:10px;
}

.left-panel p{
    margin-top:15px;
    color:#666;
}

.right-panel{
    width:65%;
    padding:40px;
}

.form-control{
    border-radius:4px;
    padding:10px;
    border:1px solid #ced4da;
}

.form-control:focus{
    border-color:#d4af37;
    box-shadow:0 0 0 0.2rem rgba(212,175,55,0.25);
}

.address-card{
    border:1px solid #dee2e6;
    border-radius:5px;
    padding:15px;
    margin-bottom:12px;
    background:#fafafa;
}

.place-btn{
    background:#d4af37;
    border:none;
    padding:10px 26px;
    border-radius:4px;
    color:white;
    font-weight:600;
    float:right;
}

.place-btn:hover{
    background:#b8962e;
}

h4,h5{
    font-weight:600;
}

</style>

<div class="checkout-wrapper">
<div class="container">

<div class="checkout-box">

<!-- LEFT PANEL -->

<div class="left-panel">
    <h2>Checkout</h2>
    <p>Please confirm your delivery details before placing the order.</p>
</div>

<!-- RIGHT PANEL -->

<div class="right-panel">

<h4 class="mb-4">Delivery Details</h4>

<form method="POST">
{% csrf_token %}

<!-- SAVED ADDRESSES -->

{% if addresses %}

<h5 class="mb-3">Saved Addresses</h5>

{% for addr in addresses %}

<div class="address-card">

<label>

<input type="radio" name="address_id" value="{{addr.id}}" {% if addr.is_default %}checked{% endif %}>

<strong>{{addr.full_name}}</strong><br>

{{addr.house}}, {{addr.area}}<br>

{{addr.city}}, {{addr.state}} - {{addr.pincode}}<br>

Phone: {{addr.phone}}

{% if addr.is_default %} <span class="badge bg-success">Default</span>
{% endif %}

</label>

</div>

{% endfor %}

<hr>

<h5 class="mb-3">Add New Address</h5>

{% endif %}

<!-- ADDRESS FORM -->

<div class="row mb-3">

<div class="col-md-6">
<input type="text" name="full_name" class="form-control" placeholder="Full Name">
</div>

<div class="col-md-6">
<input type="text" name="phone" class="form-control" placeholder="Phone Number">
</div>

</div>

<div class="row mb-3">

<div class="col-md-6">
<input type="text" name="city" class="form-control" placeholder="City">
</div>

<div class="col-md-6">
<input type="text" name="pincode" class="form-control" placeholder="Pincode">
</div>

</div>

<div class="row mb-3">

<div class="col-md-6">
<input type="text" name="house" class="form-control" placeholder="House / Flat No">
</div>

<div class="col-md-6">
<input type="text" name="state" class="form-control" placeholder="State">
</div>

</div>

<div class="mb-3">
<input type="text" name="area" class="form-control" placeholder="Area / Street">
</div>

<button type="submit" class="place-btn">
Proceed to Payment
</button>

</form>

</div>

</div>

</div>
</div>

{% endblock %}
