{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="section-intro padding-y-sm">
	<div class="container">

		<div class="intro-banner-wrap">
			<img src="{% static 'images/banners/1.jpg' %}" class="img-fluid rounded w-100">
		</div>

	</div>
</section>

<section class="section-name padding-y-sm">
	<div class="container">

		<header class="section-heading">
			<a href="./store.html" class="btn btn-outline-primary float-right">See all</a>
			<h3 class="section-title">Popular products</h3>
		</header>

		<div class="row">

			{% for product in products %}
			<div class="col-md-3">
				<div class="card card-product-grid">

					<a href="{% url 'product_detail' product.id %}" class="img-wrap">

						{% if product.image %}
						<img src="{{ product.image.url }}" class="img-fluid">
						{% else %}
						<img src="{% static 'images/default-product.png' %}" class="img-fluid">
						{% endif %}

					</a>

					<figcaption class="info-wrap">

						<a href="{% url 'product_detail' product.id %}" class="title">
							{{ product.product_name }}
						</a>

						<div class="price mt-1">
							₹{{ product.price }}
						</div>

						<div class="mt-2">
							<form action="{% url 'add_to_cart' product.id %}" method="POST" class="ajax-cart-form d-inline">
								{% csrf_token %}
								<button type="submit" class="btn btn-sm btn-primary add-to-cart-btn">
									Add to Cart
								</button>
							</form>
							<a href="{% url 'product_detail' product.id %}" class="btn btn-sm btn-success">
								Buy Now
							</a>
						</div>


					</figcaption>

				</div>
			</div>
			{% endfor %}

		</div>

	</div>
</section>

{% endblock %}
